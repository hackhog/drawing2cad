# Local build of the web app for unreleased changes. Apply after compose.yaml:
#   docker compose -f compose.yaml -f compose.build.yaml up --build
# The local tags keep a local build apart from the published images.
services:
  backend:
    build:
      context: .                # The MCP package is a path dependency at the repository root.
      dockerfile: app/backend/Dockerfile
    image: drawing2cad-backend:local

  frontend:
    build: app/frontend
    image: drawing2cad-frontend:local
