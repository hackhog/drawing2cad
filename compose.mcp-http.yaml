# Apply after compose.mcp.yaml. Only the loopback interface exposes MCP.
services:
  mcp:
    network_mode: bridge
    stdin_open: false
    command: ["--transport", "streamable-http", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:8765:8000"
    environment:
      DRAWING2CAD_HTTP_TOKEN: ${DRAWING2CAD_HTTP_TOKEN:?Set a bearer token before starting HTTP}
