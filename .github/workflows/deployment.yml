# Resolve both Compose models with synthetic configuration. No containers or model endpoints are needed.
name: Deployment configuration

on:
  pull_request:
    paths: ['deployment/**', '.env.example', 'README.md', 'app/README.md', 'drawing2cad-mcp/*.md', '.github/workflows/deployment.yml']
  push:
    branches: [main]
    paths: ['deployment/**', '.env.example', 'README.md', 'app/README.md', 'drawing2cad-mcp/*.md', '.github/workflows/deployment.yml']

permissions:
  contents: read

jobs:
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Docker Compose is available
        run: docker compose version
      - name: Compose environment precedence
        run: python -m unittest discover -s deployment -p 'test_*.py' -v
