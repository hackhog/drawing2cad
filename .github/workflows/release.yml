# Publish the MCP, backend, and frontend images of one version to ghcr.io (ADR 0027).
# Only a pushed version tag starts this workflow. All images of a version come from the tagged commit.
# Pull request and main workflows build images for tests only. They do not push images.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: The version tag has the form v<major>.<minor> or v<major>.<minor>.<patch>
        id: version
        run: |
          if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "The tag $GITHUB_REF_NAME is not a version tag." >&2
            exit 1
          fi
          echo "version=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
      - name: The tagged commit is on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "The tagged commit $GITHUB_SHA is not on main. No image is published." >&2
            exit 1
          fi
      - name: Build the MCP test image
        run: docker build -f drawing2cad-mcp/Dockerfile --target test -t drawing2cad-mcp:release-test .
      - name: MCP test suite in the test image
        # The same check as the MCP workflow: a skipped sandbox or STEPcode test is a failure.
        run: |
          set -o pipefail
          docker run --rm --network none -v "$PWD:/repo:ro" -w /repo/drawing2cad-mcp \
            drawing2cad-mcp:release-test -q -rs -p no:cacheprovider tests | tee "$RUNNER_TEMP/result.txt"
          ! grep -E '^SKIPPED.*(sandbox|STEPcode)' "$RUNNER_TEMP/result.txt"

  build:
    needs: check
    strategy:
      fail-fast: true
      matrix:
        image: [mcp, backend, frontend]
        platform:
          - { arch: amd64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
        include:
          - { image: mcp, dockerfile: drawing2cad-mcp/Dockerfile, context: ., target: production }
          - { image: backend, dockerfile: app/backend/Dockerfile, context: ., target: '' }
          - { image: frontend, dockerfile: app/frontend/Dockerfile, context: app/frontend, target: '' }
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/drawing2cad-${{ matrix.image }}
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push the platform image
        run: |
          target=()
          if [ -n "${{ matrix.target }}" ]; then target=(--target "${{ matrix.target }}"); fi
          docker buildx build --platform "linux/${{ matrix.platform.arch }}" \
            -f "${{ matrix.dockerfile }}" "${target[@]}" \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.version=$VERSION" \
            --label "org.opencontainers.image.title=drawing2cad-${{ matrix.image }}" \
            -t "$IMAGE:$VERSION-${{ matrix.platform.arch }}" --push "${{ matrix.context }}"

  publish:
    needs: [check, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Combine the platform images under the version and latest
        run: |
          for image in mcp backend frontend; do
            name="ghcr.io/${{ github.repository_owner }}/drawing2cad-$image"
            docker buildx imagetools create -t "$name:$VERSION" -t "$name:latest" \
              "$name:$VERSION-amd64" "$name:$VERSION-arm64"
            docker buildx imagetools inspect "$name:$VERSION"
          done
