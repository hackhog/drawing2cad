# Test the web backend (ADR 0018) and build its container image.
# The tests use a scripted model; this workflow needs no secrets and calls no model endpoint.
# This workflow does not commit or deploy artifacts.
name: Backend

on:
  pull_request:
    paths: ['app/backend/**', 'drawing2cad-mcp/**', 'skills/drawing2cad/SKILL.md', '.github/workflows/backend.yml']
  push:
    branches: [main]
    paths: ['app/backend/**', 'drawing2cad-mcp/**', 'skills/drawing2cad/SKILL.md', '.github/workflows/backend.yml']

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app/backend
    steps:
      - uses: actions/checkout@v4
      - name: Install Poppler
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'  # Same version as the backend image.
      - name: Install Poetry
        run: pipx install --python "$(command -v python)" poetry==2.4.1  # Same version as app/backend/Dockerfile.
      # poetry install stops if pyproject.toml and poetry.lock do not agree.
      - run: poetry install
      - name: Backend lock file agrees with the MCP package
        run: |
          # The lock records the version and dependencies of the drawing2cad-mcp path dependency.
          # poetry lock keeps the locked versions; a change here shows that the lock is out of date.
          poetry lock
          git diff --exit-code poetry.lock
      - run: poetry run pytest
      - name: Build the container image
        working-directory: .
        run: docker build -f app/backend/Dockerfile -t drawing2cad-backend:ci .
