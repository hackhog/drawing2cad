# Drive the built UI in Google Chrome against the real web backend (app/backend/tests/test_browser.py).
# The tests use a scripted model; this workflow needs no secrets and calls no model endpoint.
name: Browser

on:
  pull_request:
    paths: ['app/**', 'drawing2cad-mcp/**', '.github/workflows/browser.yml']
  push:
    branches: [main]
    paths: ['app/**', 'drawing2cad-mcp/**', '.github/workflows/browser.yml']

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest    # Includes Google Chrome; Playwright uses it, so no browser download is needed.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json
      - name: Build the UI
        working-directory: app/frontend
        run: npm ci --no-audit --no-fund && npm run build
      - name: Install Poppler
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Poetry
        run: pipx install --python "$(command -v python)" poetry==2.4.1  # Same version as deployment/Dockerfile.
      - name: Browser tests
        working-directory: app/backend
        run: |
          set -o pipefail
          poetry install
          poetry run pytest tests/test_browser.py -q -rs | tee result.txt
          # A skipped browser test is a failure in CI: Chrome and the UI build must be present.
          ! grep -q skipped result.txt
