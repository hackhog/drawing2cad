# Verify generated diagram content against the JSON source and maintained renderer.
# Build with npm run build --prefix tools/diagrams. No external renderer is required.
# This workflow does not commit or deploy artifacts.
name: Diagrams up to date

on:
  pull_request:
    paths:
      - 'docs/diagrams/**'
      - 'tools/diagrams/**'
      - '.github/workflows/diagrams.yml'
  push:
    branches: [main]
    paths:
      - 'docs/diagrams/**'
      - 'tools/diagrams/**'
      - '.github/workflows/diagrams.yml'

permissions:
  contents: read

jobs:
  diagrams-up-to-date:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix tools/diagrams
      - run: npm run test --prefix tools/diagrams
      - run: npm run check --prefix tools/diagrams
