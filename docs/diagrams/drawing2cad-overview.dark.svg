<text x="1580" y="523" font-size="11.5" fill="#a8b8cb" font-weight="400" text-anchor="middle">Sources, jobs, JSON, DXF, PDF, STEP</text>
</g>
<rect x="40" y="924" width="404.5" height="303" rx="10" fill="#142238" stroke="#37516d"/>
<text x="56" y="952" font-size="15" fill="#e5edf7" font-weight="700" text-anchor="start">M2 MCP: shared services</text>
<text x="56" y="978" font-size="12.5" fill="#a8b8cb" font-weight="400" text-anchor="start">PDF bytes arrive through bounded resumable uploads</text>
<text x="56" y="995" font-size="12.5" fill="#a8b8cb" font-weight="400" text-anchor="start"></text>
<text x="56" y="1012" font-size="12.5" fill="#a8b8cb" font-weight="400" text-anchor="start">Source, run, job, and artifact IDs keep paths internal</text>
<text x="56" y="1029" font-size="12.5" fill="#a8b8cb" font-weight="400" text-anchor="start"></text>
<text x="56" y="1046" font-size="12.5" fill="#a8b8cb" font-weight="400" text-anchor="start">Persistent jobs, notes, revisions, and review gates</text>
<text x="56" y="1063" font-size="12.5" fill="#a8b8cb" font-weight="400" text-anchor="start"></text>
<text x="56" y="1080" font-size="12.5" fill="#a8b8cb" font-weight="400" text-anchor="start">MCP and web routes share one Python service</text>
<text x="56" y="1097" font-size="12.5" fill="#a8b8cb" font-weight="400" text-anchor="start"></text>
<rect x="468.5" y="924" width="404.5" height="303" rx="10" fill="#142238" stroke="#37516d"/>
<text x="484.5" y="952" font-size="15" fill="#e5edf7" font-weight="700" text-anchor="start">Headless worker boundary</text>
<text x="484.5" y="978" font-size="12.5" fill="#a8b8cb" font-weight="400" text-anchor="start">Landlock, seccomp, finite resources, and timeouts</text>
<text x="484.5" y="995" font-size="12.5" fill="#a8b8cb" font-weight="400" text-anchor="start"></text>
<text x="484.5" y="1012" font-size="12.5" fill="#a8b8cb" font-weight="400" text-anchor="start">No CAD GUI, FreeCAD proxy, or Docker socket</text>
<text x="484.5" y="1029" font-size="12.5" fill="#a8b8cb" font-weight="400" text-anchor="start"></text>
<text x="484.5" y="1046" font-size="12.5" fill="#a8b8cb" font-weight="400" text-anchor="start">Fresh STEP import validates the AP214 candidate</text>
<text x="484.5" y="1063" font-size="12.5" fill="#a8b8cb" font-weight="400" text-anchor="start"></text>
<text x="484.5" y="1080" font-size="12.5" fill="#a8b8cb" font-weight="400" text-anchor="start">Supplied 2D views become native DXF dimensions and PDF</text>
<text x="484.5" y="1097" font-size="12.5" fill="#a8b8cb" font-weight="400" text-anchor="start"></text>
<text x="484.5" y="1114" font-size="12.5" fill="#a8b8cb" font-weight="400" text-anchor="start">Poppler and Tesseract verify the final PDF bytes</text>
<text x="484.5" y="1131" font-size="12.5" fill="#a8b8cb" font-weight="400" text-anchor="start"></text>
<rect x="897" y="924" width="404.5" height="303" rx="10" fill="#142238" stroke="#37516d"/>
<text x="913" y="952" font-size="15" fill="#e5edf7" font-weight="700" text-anchor="start">Web delivery and acceptance follow-up</text>
<text x="913" y="978" font-size="12.5" fill="#a8b8cb" font-weight="400" text-anchor="start">Web routes and agent runs share one service instance</text>
<text x="913" y="995" font-size="12.5" fill="#a8b8cb" font-weight="400" text-anchor="start"></text>
<text x="913" y="1012" font-size="12.5" fill="#a8b8cb" font-weight="400" text-anchor="start">Failed runs retain candidate STEP and drawing artifacts</text>
<text x="913" y="1029" font-size="12.5" fill="#a8b8cb" font-weight="400" text-anchor="start"></text>
<text x="913" y="1046" font-size="12.5" fill="#a8b8cb" font-weight="400" text-anchor="start">Last results show revision, blockers, and not released</text>
<text x="913" y="1063" font-size="12.5" fill="#a8b8cb" font-weight="400" text-anchor="start"></text>
<text x="913" y="1080" font-size="12.5" fill="#a8b8cb" font-weight="400" text-anchor="start">Derived views, sections, title block, and GPS frames</text>
<text x="913" y="1097" font-size="12.5" fill="#a8b8cb" font-weight="400" text-anchor="start">render</text>
<text x="913" y="1114" font-size="12.5" fill="#a8b8cb" font-weight="400" text-anchor="start"></text>
<text x="913" y="1131" font-size="12.5" fill="#a8b8cb" font-weight="400" text-anchor="start">Drawing review follows the current model build</text>
<text x="913" y="1148" font-size="12.5" fill="#a8b8cb" font-weight="400" text-anchor="start"></text>
<text x="913" y="1165" font-size="12.5" fill="#a8b8cb" font-weight="400" text-anchor="start">Resource acceptance remains deferred until milestones</text>
<text x="913" y="1182" font-size="12.5" fill="#a8b8cb" font-weight="400" text-anchor="start">finish</text>
<text x="913" y="1199" font-size="12.5" fill="#a8b8cb" font-weight="400" text-anchor="start"></text>
<rect x="1325.5" y="924" width="404.5" height="303" rx="10" fill="#142238" stroke="#37516d"/>
<text x="1341.5" y="952" font-size="15" fill="#e5edf7" font-weight="700" text-anchor="start">M3: bounded adapter, open</text>
<text x="1341.5" y="978" font-size="12.5" fill="#a8b8cb" font-weight="400" text-anchor="start">AP242 with application construction and nominal PMI</text>
<text x="1341.5" y="995" font-size="12.5" fill="#a8b8cb" font-weight="400" text-anchor="start"></text>
<text x="1341.5" y="1012" font-size="12.5" fill="#a8b8cb" font-weight="400" text-anchor="start">Fresh worker replay and parameter-change checks</text>
<text x="1341.5" y="1029" font-size="12.5" fill="#a8b8cb" font-weight="400" text-anchor="start"></text>
<text x="1341.5" y="1046" font-size="12.5" fill="#a8b8cb" font-weight="400" text-anchor="start">PDF input only; CAD-specific exports are separate</text>
<text x="1341.5" y="1063" font-size="12.5" fill="#a8b8cb" font-weight="400" text-anchor="start"></text>
<text x="1341.5" y="1080" font-size="12.5" fill="#a8b8cb" font-weight="400" text-anchor="start">STEPcode checks and actual stored-PMI inspection views</text>
<text x="1341.5" y="1097" font-size="12.5" fill="#a8b8cb" font-weight="400" text-anchor="start"></text>
<text x="40" y="1257" font-size="11" fill="#a8b8cb" font-weight="400" text-anchor="start">Source: docs/diagrams/drawing2cad-overview.json | ADR 0014</text>
</g></svg>
