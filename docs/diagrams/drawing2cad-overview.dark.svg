<rect x="40" y="744" width="282" height="269" rx="10" fill="#142238" stroke="#37516d"/>
<text x="56" y="772" font-size="15" fill="#e5edf7" font-weight="700" text-anchor="start">M1: metric prototype</text>
<text x="56" y="798" font-size="12.5" fill="#a8b8cb" font-weight="400" text-anchor="start">One MCP image includes PDF and CAD</text>
<text x="56" y="815" font-size="12.5" fill="#a8b8cb" font-weight="400" text-anchor="start">dependencies</text>
<text x="56" y="832" font-size="12.5" fill="#a8b8cb" font-weight="400" text-anchor="start"></text>
<text x="56" y="849" font-size="12.5" fill="#a8b8cb" font-weight="400" text-anchor="start">Editable JSON is the construction</text>
<text x="56" y="866" font-size="12.5" fill="#a8b8cb" font-weight="400" text-anchor="start">source</text>
<text x="56" y="883" font-size="12.5" fill="#a8b8cb" font-weight="400" text-anchor="start"></text>
<text x="56" y="900" font-size="12.5" fill="#a8b8cb" font-weight="400" text-anchor="start">Granular tools and full builds use</text>
<text x="56" y="917" font-size="12.5" fill="#a8b8cb" font-weight="400" text-anchor="start">one feature graph</text>
<text x="56" y="934" font-size="12.5" fill="#a8b8cb" font-weight="400" text-anchor="start"></text>
<text x="56" y="951" font-size="12.5" fill="#a8b8cb" font-weight="400" text-anchor="start">Fresh-worker STEP import is separate</text>
<text x="56" y="968" font-size="12.5" fill="#a8b8cb" font-weight="400" text-anchor="start">from external checks</text>
<text x="56" y="985" font-size="12.5" fill="#a8b8cb" font-weight="400" text-anchor="start"></text>
<rect x="346" y="744" width="282" height="269" rx="10" fill="#142238" stroke="#37516d"/>
<text x="362" y="772" font-size="15" fill="#e5edf7" font-weight="700" text-anchor="start">Worker boundary</text>
<text x="362" y="798" font-size="12.5" fill="#a8b8cb" font-weight="400" text-anchor="start">Landlock filesystem rules and seccomp</text>
<text x="362" y="815" font-size="12.5" fill="#a8b8cb" font-weight="400" text-anchor="start">syscall restrictions</text>
<text x="362" y="832" font-size="12.5" fill="#a8b8cb" font-weight="400" text-anchor="start"></text>
<text x="362" y="849" font-size="12.5" fill="#a8b8cb" font-weight="400" text-anchor="start">Per-job process, directory, resource</text>
<text x="362" y="866" font-size="12.5" fill="#a8b8cb" font-weight="400" text-anchor="start">limits and timeout</text>
<text x="362" y="883" font-size="12.5" fill="#a8b8cb" font-weight="400" text-anchor="start"></text>
<text x="362" y="900" font-size="12.5" fill="#a8b8cb" font-weight="400" text-anchor="start">CAD execution fails when the sandbox</text>
<text x="362" y="917" font-size="12.5" fill="#a8b8cb" font-weight="400" text-anchor="start">is unavailable</text>
<text x="362" y="934" font-size="12.5" fill="#a8b8cb" font-weight="400" text-anchor="start"></text>
<text x="362" y="951" font-size="12.5" fill="#a8b8cb" font-weight="400" text-anchor="start">No Docker socket or CAD GUI is</text>
<text x="362" y="968" font-size="12.5" fill="#a8b8cb" font-weight="400" text-anchor="start">required</text>
<text x="362" y="985" font-size="12.5" fill="#a8b8cb" font-weight="400" text-anchor="start"></text>
<rect x="652" y="744" width="282" height="269" rx="10" fill="#142238" stroke="#37516d"/>
<text x="668" y="772" font-size="15" fill="#e5edf7" font-weight="700" text-anchor="start">M2: complete service, pending</text>
<text x="668" y="798" font-size="12.5" fill="#a8b8cb" font-weight="400" text-anchor="start">One Python application serves MCP and</text>
<text x="668" y="815" font-size="12.5" fill="#a8b8cb" font-weight="400" text-anchor="start">the web API</text>
<text x="668" y="832" font-size="12.5" fill="#a8b8cb" font-weight="400" text-anchor="start"></text>
<text x="668" y="849" font-size="12.5" fill="#a8b8cb" font-weight="400" text-anchor="start">PDF uploads return source IDs;</text>
<text x="668" y="866" font-size="12.5" fill="#a8b8cb" font-weight="400" text-anchor="start">outputs use artifact IDs</text>
<text x="668" y="883" font-size="12.5" fill="#a8b8cb" font-weight="400" text-anchor="start"></text>
<text x="668" y="900" font-size="12.5" fill="#a8b8cb" font-weight="400" text-anchor="start">React, shadcn, TanStack Router and</text>
<text x="668" y="917" font-size="12.5" fill="#a8b8cb" font-weight="400" text-anchor="start">Query</text>
<text x="668" y="934" font-size="12.5" fill="#a8b8cb" font-weight="400" text-anchor="start"></text>
<text x="668" y="951" font-size="12.5" fill="#a8b8cb" font-weight="400" text-anchor="start">Deliver a reviewed technical drawing</text>
<text x="668" y="968" font-size="12.5" fill="#a8b8cb" font-weight="400" text-anchor="start">and matching model</text>
<text x="668" y="985" font-size="12.5" fill="#a8b8cb" font-weight="400" text-anchor="start"></text>
<rect x="958" y="744" width="282" height="269" rx="10" fill="#142238" stroke="#37516d"/>
<text x="974" y="772" font-size="15" fill="#e5edf7" font-weight="700" text-anchor="start">M3: AP242, pending</text>
<text x="974" y="798" font-size="12.5" fill="#a8b8cb" font-weight="400" text-anchor="start">AP242 construction and editable</text>
<text x="974" y="815" font-size="12.5" fill="#a8b8cb" font-weight="400" text-anchor="start">import adapters</text>
<text x="974" y="832" font-size="12.5" fill="#a8b8cb" font-weight="400" text-anchor="start"></text>
<text x="974" y="849" font-size="12.5" fill="#a8b8cb" font-weight="400" text-anchor="start">STEP-only reconstruction and</text>
<text x="974" y="866" font-size="12.5" fill="#a8b8cb" font-weight="400" text-anchor="start">parameter-change tests</text>
<text x="974" y="883" font-size="12.5" fill="#a8b8cb" font-weight="400" text-anchor="start"></text>
<text x="974" y="900" font-size="12.5" fill="#a8b8cb" font-weight="400" text-anchor="start">Semantic PMI and graphical PMI</text>
<text x="974" y="917" font-size="12.5" fill="#a8b8cb" font-weight="400" text-anchor="start">verified separately</text>
<text x="974" y="934" font-size="12.5" fill="#a8b8cb" font-weight="400" text-anchor="start"></text>
<text x="974" y="951" font-size="12.5" fill="#a8b8cb" font-weight="400" text-anchor="start">JSON sidecars and end bodies do not</text>
<text x="974" y="968" font-size="12.5" fill="#a8b8cb" font-weight="400" text-anchor="start">prove these claims</text>
<text x="974" y="985" font-size="12.5" fill="#a8b8cb" font-weight="400" text-anchor="start"></text>
<text x="40" y="1043" font-size="11" fill="#a8b8cb" font-weight="400" text-anchor="start">Source: docs/diagrams/drawing2cad-overview.json | ADR 0014</text>
</g></svg>
