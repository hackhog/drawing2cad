<rect x="40" y="744" width="404.5" height="235" rx="10" fill="#142238" stroke="#37516d"/>
<text x="56" y="772" font-size="15" fill="#e5edf7" font-weight="700" text-anchor="start">M2 MCP: shared services</text>
<text x="56" y="798" font-size="12.5" fill="#a8b8cb" font-weight="400" text-anchor="start">PDF bytes arrive through bounded resumable uploads</text>
<text x="56" y="815" font-size="12.5" fill="#a8b8cb" font-weight="400" text-anchor="start"></text>
<text x="56" y="832" font-size="12.5" fill="#a8b8cb" font-weight="400" text-anchor="start">Source, run, job, and artifact IDs keep paths internal</text>
<text x="56" y="849" font-size="12.5" fill="#a8b8cb" font-weight="400" text-anchor="start"></text>
<text x="56" y="866" font-size="12.5" fill="#a8b8cb" font-weight="400" text-anchor="start">Persistent jobs, notes, revisions, and review gates</text>
<text x="56" y="883" font-size="12.5" fill="#a8b8cb" font-weight="400" text-anchor="start"></text>
<text x="56" y="900" font-size="12.5" fill="#a8b8cb" font-weight="400" text-anchor="start">MCP currently uses one configured principal</text>
<text x="56" y="917" font-size="12.5" fill="#a8b8cb" font-weight="400" text-anchor="start"></text>
<rect x="468.5" y="744" width="404.5" height="235" rx="10" fill="#142238" stroke="#37516d"/>
<text x="484.5" y="772" font-size="15" fill="#e5edf7" font-weight="700" text-anchor="start">Headless worker boundary</text>
<text x="484.5" y="798" font-size="12.5" fill="#a8b8cb" font-weight="400" text-anchor="start">Landlock, seccomp, finite resources, and timeouts</text>
<text x="484.5" y="815" font-size="12.5" fill="#a8b8cb" font-weight="400" text-anchor="start"></text>
<text x="484.5" y="832" font-size="12.5" fill="#a8b8cb" font-weight="400" text-anchor="start">No CAD GUI, FreeCAD proxy, or Docker socket</text>
<text x="484.5" y="849" font-size="12.5" fill="#a8b8cb" font-weight="400" text-anchor="start"></text>
<text x="484.5" y="866" font-size="12.5" fill="#a8b8cb" font-weight="400" text-anchor="start">Fresh STEP import validates the AP214 candidate</text>
<text x="484.5" y="883" font-size="12.5" fill="#a8b8cb" font-weight="400" text-anchor="start"></text>
<text x="484.5" y="900" font-size="12.5" fill="#a8b8cb" font-weight="400" text-anchor="start">Supplied 2D views become native DXF dimensions and PDF</text>
<text x="484.5" y="917" font-size="12.5" fill="#a8b8cb" font-weight="400" text-anchor="start"></text>
<rect x="897" y="744" width="404.5" height="235" rx="10" fill="#142238" stroke="#37516d"/>
<text x="913" y="772" font-size="15" fill="#e5edf7" font-weight="700" text-anchor="start">Web and acceptance follow-up</text>
<text x="913" y="798" font-size="12.5" fill="#a8b8cb" font-weight="400" text-anchor="start">Issue #26: routes and React interface use shared</text>
<text x="913" y="815" font-size="12.5" fill="#a8b8cb" font-weight="400" text-anchor="start">services</text>
<text x="913" y="832" font-size="12.5" fill="#a8b8cb" font-weight="400" text-anchor="start"></text>
<text x="913" y="849" font-size="12.5" fill="#a8b8cb" font-weight="400" text-anchor="start">No automatic arbitrary projection or section extraction</text>
<text x="913" y="866" font-size="12.5" fill="#a8b8cb" font-weight="400" text-anchor="start"></text>
<text x="913" y="883" font-size="12.5" fill="#a8b8cb" font-weight="400" text-anchor="start">Drawing review follows the current model build</text>
<text x="913" y="900" font-size="12.5" fill="#a8b8cb" font-weight="400" text-anchor="start"></text>
<text x="913" y="917" font-size="12.5" fill="#a8b8cb" font-weight="400" text-anchor="start">Resource acceptance remains deferred until milestones</text>
<text x="913" y="934" font-size="12.5" fill="#a8b8cb" font-weight="400" text-anchor="start">finish</text>
<text x="913" y="951" font-size="12.5" fill="#a8b8cb" font-weight="400" text-anchor="start"></text>
<rect x="1325.5" y="744" width="404.5" height="235" rx="10" fill="#142238" stroke="#37516d"/>
<text x="1341.5" y="772" font-size="15" fill="#e5edf7" font-weight="700" text-anchor="start">M3: AP242, pending #25</text>
<text x="1341.5" y="798" font-size="12.5" fill="#a8b8cb" font-weight="400" text-anchor="start">AP242 construction and editable import adapters</text>
<text x="1341.5" y="815" font-size="12.5" fill="#a8b8cb" font-weight="400" text-anchor="start"></text>
<text x="1341.5" y="832" font-size="12.5" fill="#a8b8cb" font-weight="400" text-anchor="start">STEP-only reconstruction and parameter-change tests</text>
<text x="1341.5" y="849" font-size="12.5" fill="#a8b8cb" font-weight="400" text-anchor="start"></text>
<text x="1341.5" y="866" font-size="12.5" fill="#a8b8cb" font-weight="400" text-anchor="start">Semantic and graphical PMI have separate tests</text>
<text x="1341.5" y="883" font-size="12.5" fill="#a8b8cb" font-weight="400" text-anchor="start"></text>
<text x="1341.5" y="900" font-size="12.5" fill="#a8b8cb" font-weight="400" text-anchor="start">JSON descriptions and end bodies do not prove these</text>
<text x="1341.5" y="917" font-size="12.5" fill="#a8b8cb" font-weight="400" text-anchor="start">claims</text>
<text x="1341.5" y="934" font-size="12.5" fill="#a8b8cb" font-weight="400" text-anchor="start"></text>
<text x="40" y="1009" font-size="11" fill="#a8b8cb" font-weight="400" text-anchor="start">Source: docs/diagrams/drawing2cad-overview.json | ADR 0014</text>
