ded resumable uploads\u003c/text>\n\u003ctext x=\"56\" y=\"815\" font-size=\"12.5\" fill=\"#a8b8cb\" font-weight=\"400\" text-anchor=\"start\">\u003c/text>\n\u003ctext x=\"56\" y=\"832\" font-size=\"12.5\" fill=\"#a8b8cb\" font-weight=\"400\" text-anchor=\"start\">Source, run, job, and artifact IDs keep paths internal\u003c/text>\n\u003ctext x=\"56\" y=\"849\" font-size=\"12.5\" fill=\"#a8b8cb\" font-weight=\"400\" text-anchor=\"start\">\u003c/text>\n\u003ctext x=\"56\" y=\"866\" font-size=\"12.5\" fill=\"#a8b8cb\" font-weight=\"400\" text-anchor=\"start\">Persistent jobs, notes, revisions, and review gates\u003c/text>\n\u003ctext x=\"56\" y=\"883\" font-size=\"12.5\" fill=\"#a8b8cb\" font-weight=\"400\" text-anchor=\"start\">\u003c/text>\n\u003ctext x=\"56\" y=\"900\" font-size=\"12.5\" fill=\"#a8b8cb\" font-weight=\"400\" text-anchor=\"start\">MCP and future web routes share one Python service\u003c/text>\n\u003ctext x=\"56\" y=\"917\" font-size=\"12.5\" fill=\"#a8b8cb\" font-weight=\"400\" text-anchor=\"start\">\u003c/text>\n\u003crect x=\"468.5\" y=\"744\" width=\"404.5\" height=\"218\" rx=\"10\" fill=\"#142238\" stroke=\"#37516d\"/>\n\u003ctext x=\"484.5\" y=\"772\" font-size=\"15\" fill=\"#e5edf7\" font-weight=\"700\" text-anchor=\"start\">Headless worker boundary\u003c/text>\n\u003ctext x=\"484.5\" y=\"798\" font-size=\"12.5\" fill=\"#a8b8cb\" font-weight=\"400\" text-anchor=\"start\">Landlock, seccomp, finite resources, and timeouts\u003c/text>\n\u003ctext x=\"484.5\" y=\"815\" font-size=\"12.5\" fill=\"#a8b8cb\" font-weight=\"400\" text-anchor=\"start\">\u003c/text>\n\u003ctext x=\"484.5\" y=\"832\" font-size=\"12.5\" fill=\"#a8b8cb\" font-weight=\"400\" text-anchor=\"start\">No CAD GUI, FreeCAD proxy, or Docker socket\u003c/text>\n\u003ctext x=\"484.5\" y=\"849\" font-size=\"12.5\" fill=\"#a8b8cb\" font-weight=\"400\" text-anchor=\"start\">\u003c/text>\n\u003ctext x=\"484.5\" y=\"866\" font-size=\"12.5\" fill=\"#a8b8cb\" font-weight=\"400\" text-anchor=\"start\">Fresh STEP import validates the AP214 candidate\u003c/text>\n\u003ctext x=\"484.5\" y=\"883\" font-size=\"12.5\" fill=\"#a8b8cb\" font-weight=\"400\" text-anchor=\"start\">\u003c/text>\n\u003ctext x=\"484.5\" y=\"900\" font-size=\"12.5\" fill=\"#a8b8cb\" font-weight=\"400\" text-anchor=\"start\">Supplied 2D views become native DXF dimensions and PDF\u003c/text>\n\u003ctext x=\"484.5\" y=\"917\" font-size=\"12.5\" fill=\"#a8b8cb\" font-weight=\"400\" text-anchor=\"start\">\u003c/text>\n\u003crect x=\"897\" y=\"744\" width=\"404.5\" height=\"218\" rx=\"10\" fill=\"#142238\" stroke=\"#37516d\"/>\n\u003ctext x=\"913\" y=\"772\" font-size=\"15\" fill=\"#e5edf7\" font-weight=\"700\" text-anchor=\"start\">Web and acceptance follow-up\u003c/text>\n\u003ctext x=\"913\" y=\"798\" font-size=\"12.5\" fill=\"#a8b8cb\" font-weight=\"400\" text-anchor=\"start\">Issue #26: connect the web UI to shared service routes\u003c/text>\n\u003ctext x=\"913\" y=\"815\" font-size=\"12.5\" fill=\"#a8b8cb\" font-weight=\"400\" text-anchor=\"start\">\u003c/text>\n\u003ctext x=\"913\" y=\"832\" font-size=\"12.5\" fill=\"#a8b8cb\" font-weight=\"400\" text-anchor=\"start\">No automatic arbitrary projection or section extraction\u003c/text>\n\u003ctext x=\"913\" y=\"849\" font-size=\"12.5\" fill=\"#a8b8cb\" font-weight=\"400\" text-anchor=\"start\">\u003c/text>\n\u003ctext x=\"913\" y=\"866\" font-size=\"12.5\" fill=\"#a8b8cb\" font-weight=\"400\" text-anchor=\"start\">Drawing review follows the current model build\u003c/text>\n\u003ctext x=\"913\" y=\"883\" font-size=\"12.5\" fill=\"#a8b8cb\" font-weight=\"400\" text-anchor=\"start\">\u003c/text>\n\u003ctext x=\"913\" y=\"900\" font-size=\"12.5\" fill=\"#a8b8cb\" font-weight=\"400\" text-anchor=\"start\">Resource acceptance remains deferred until milestones\u003c/text>\n\u003ctext x=\"913\" y=\"917\" font-size=\"12.5\" fill=\"#a8b8cb\" font-weight=\"400\" text-anchor=\"start\">finish\u003c/text>\n\u003ctext x=\"913\" y=\"934\" font-size=\"12
