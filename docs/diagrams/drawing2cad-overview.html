fill=\"#a8b8cb\" font-weight=\"400\" text-anchor=\"start\">\u003c/text>\n\u003ctext x=\"913\" y=\"1063\" font-size=\"12.5\" fill=\"#a8b8cb\" font-weight=\"400\" text-anchor=\"start\">Drawing review follows the current model build\u003c/text>\n\u003ctext x=\"913\" y=\"1080\" font-size=\"12.5\" fill=\"#a8b8cb\" font-weight=\"400\" text-anchor=\"start\">\u003c/text>\n\u003ctext x=\"913\" y=\"1097\" font-size=\"12.5\" fill=\"#a8b8cb\" font-weight=\"400\" text-anchor=\"start\">Resource acceptance remains deferred until milestones\u003c/text>\n\u003ctext x=\"913\" y=\"1114\" font-size=\"12.5\" fill=\"#a8b8cb\" font-weight=\"400\" text-anchor=\"start\">finish\u003c/text>\n\u003ctext x=\"913\" y=\"1131\" font-size=\"12.5\" fill=\"#a8b8cb\" font-weight=\"400\" text-anchor=\"start\">\u003c/text>\n\u003crect x=\"1325.5\" y=\"924\" width=\"404.5\" height=\"235\" rx=\"10\" fill=\"#142238\" stroke=\"#37516d\"/>\n\u003ctext x=\"1341.5\" y=\"952\" font-size=\"15\" fill=\"#e5edf7\" font-weight=\"700\" text-anchor=\"start\">M3: bounded adapter, open\u003c/text>\n\u003ctext x=\"1341.5\" y=\"978\" font-size=\"12.5\" fill=\"#a8b8cb\" font-weight=\"400\" text-anchor=\"start\">AP242 with application construction and nominal PMI\u003c/text>\n\u003ctext x=\"1341.5\" y=\"995\" font-size=\"12.5\" fill=\"#a8b8cb\" font-weight=\"400\" text-anchor=\"start\">\u003c/text>\n\u003ctext x=\"1341.5\" y=\"1012\" font-size=\"12.5\" fill=\"#a8b8cb\" font-weight=\"400\" text-anchor=\"start\">Fresh worker replay and parameter-change checks\u003c/text>\n\u003ctext x=\"1341.5\" y=\"1029\" font-size=\"12.5\" fill=\"#a8b8cb\" font-weight=\"400\" text-anchor=\"start\">\u003c/text>\n\u003ctext x=\"1341.5\" y=\"1046\" font-size=\"12.5\" fill=\"#a8b8cb\" font-weight=\"400\" text-anchor=\"start\">PDF input only; CAD-specific exports are separate\u003c/text>\n\u003ctext x=\"1341.5\" y=\"1063\" font-size=\"12.5\" fill=\"#a8b8cb\" font-weight=\"400\" text-anchor=\"start\">\u003c/text>\n\u003ctext x=\"1341.5\" y=\"1080\" font-size=\"12.5\" fill=\"#a8b8cb\" font-weight=\"400\" text-anchor=\"start\">STEPcode checks and actual stored-PMI inspection views\u003c/text>\n\u003ctext x=\"1341.5\" y=\"1097\" font-size=\"12.5\" fill=\"#a8b8cb\" font-weight=\"400\" text-anchor=\"start\">\u003c/text>\n\u003ctext x=\"40\" y=\"1189\" font-size=\"11\" fill=\"#a8b8cb\" font-weight=\"400\" text-anchor=\"start\">Source: docs/diagrams/drawing2cad-overview.json | ADR 0014\u003c/text>\n\u003c/g>\u003c/svg>\n"};
let theme=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
const diagram=document.getElementById('diagram');
function show(){diagram.innerHTML=variants[theme];document.body.style.background=theme==='dark'?'#0c1624':'#f6f8fb';}
document.getElementById('theme').onclick=()=>{theme=theme==='dark'?'light':'dark';show();};
document.getElementById('zoom').oninput=(event)=>{diagram.style.width=event.target.value+'%';};
document.querySelectorAll('[data-format]').forEach((button)=>button.onclick=()=>{const mode=button.dataset.format.slice(4);const url=URL.createObjectURL(new Blob([variants[mode]],{type:'image/svg+xml'}));const link=document.createElement('a');link.href=url;link.download='drawing2cad-overview.'+mode+'.svg';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);});
show();
</script></body></html>
