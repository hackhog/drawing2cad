<rect x="40" y="924" width="404.5" height="218" rx="10" fill="#ffffff" stroke="#c5d1df"/>
<text x="56" y="952" font-size="15" fill="#17263d" font-weight="700" text-anchor="start">M2 MCP: shared services</text>
<text x="56" y="978" font-size="12.5" fill="#526477" font-weight="400" text-anchor="start">PDF bytes arrive through bounded resumable uploads</text>
<text x="56" y="995" font-size="12.5" fill="#526477" font-weight="400" text-anchor="start"></text>
<text x="56" y="1012" font-size="12.5" fill="#526477" font-weight="400" text-anchor="start">Source, run, job, and artifact IDs keep paths internal</text>
<text x="56" y="1029" font-size="12.5" fill="#526477" font-weight="400" text-anchor="start"></text>
<text x="56" y="1046" font-size="12.5" fill="#526477" font-weight="400" text-anchor="start">Persistent jobs, notes, revisions, and review gates</text>
<text x="56" y="1063" font-size="12.5" fill="#526477" font-weight="400" text-anchor="start"></text>
<text x="56" y="1080" font-size="12.5" fill="#526477" font-weight="400" text-anchor="start">MCP and future web routes share one Python service</text>
<text x="56" y="1097" font-size="12.5" fill="#526477" font-weight="400" text-anchor="start"></text>
<rect x="468.5" y="924" width="404.5" height="218" rx="10" fill="#ffffff" stroke="#c5d1df"/>
<text x="484.5" y="952" font-size="15" fill="#17263d" font-weight="700" text-anchor="start">Headless worker boundary</text>
<text x="484.5" y="978" font-size="12.5" fill="#526477" font-weight="400" text-anchor="start">Landlock, seccomp, finite resources, and timeouts</text>
<text x="484.5" y="995" font-size="12.5" fill="#526477" font-weight="400" text-anchor="start"></text>
<text x="484.5" y="1012" font-size="12.5" fill="#526477" font-weight="400" text-anchor="start">No CAD GUI, FreeCAD proxy, or Docker socket</text>
<text x="484.5" y="1029" font-size="12.5" fill="#526477" font-weight="400" text-anchor="start"></text>
<text x="484.5" y="1046" font-size="12.5" fill="#526477" font-weight="400" text-anchor="start">Fresh STEP import validates the AP214 candidate</text>
<text x="484.5" y="1063" font-size="12.5" fill="#526477" font-weight="400" text-anchor="start"></text>
<text x="484.5" y="1080" font-size="12.5" fill="#526477" font-weight="400" text-anchor="start">Supplied 2D views become native DXF dimensions and PDF</text>
<text x="484.5" y="1097" font-size="12.5" fill="#526477" font-weight="400" text-anchor="start"></text>
<rect x="897" y="924" width="404.5" height="218" rx="10" fill="#ffffff" stroke="#c5d1df"/>
<text x="913" y="952" font-size="15" fill="#17263d" font-weight="700" text-anchor="start">Web and acceptance follow-up</text>
<text x="913" y="978" font-size="12.5" fill="#526477" font-weight="400" text-anchor="start">Issue #26: connect the web UI to shared service routes</text>
<text x="913" y="995" font-size="12.5" fill="#526477" font-weight="400" text-anchor="start"></text>
<text x="913" y="1012" font-size="12.5" fill="#526477" font-weight="400" text-anchor="start">No automatic arbitrary projection or section extraction</text>
<text x="913" y="1029" font-size="12.5" fill="#526477" font-weight="400" text-anchor="start"></text>
<text x="913" y="1046" font-size="12.5" fill="#526477" font-weight="400" text-anchor="start">Drawing review follows the current model build</text>
<text x="913" y="1063" font-size="12.5" fill="#526477" font-weight="400" text-anchor="start"></text>
<text x="913" y="1080" font-size="12.5" fill="#526477" font-weight="400" text-anchor="start">Resource acceptance remains deferred until milestones</text>
<text x="913" y="1097" font-size="12.5" fill="#526477" font-weight="400" text-anchor="start">finish</text>
<text x="913" y="1114" font-size="12.5" fill="#526477" font-weight="400" text-anchor="start"></text>
<rect x="1325.5" y="924" width="404.5" height="218" rx="10" fill="#ffffff" stroke="#c5d1df"/>
<text x="1341.5" y="952" font-size="15" fill="#17263d" font-weight="700" text-anchor="start">M3: bounded adapter, #25 open</text>
<text x="1341.5" y="978" font-size="12.5" fill="#526477" font-weight="400" text-anchor="start">AP242 with application construction and nominal PMI</text>
<text x="1341.5" y="995" font-size="12.5" fill="#526477" font-weight="400" text-anchor="start"></text>
<text x="1341.5" y="1012" font-size="12.5" fill="#526477" font-weight="400" text-anchor="start">Fresh worker replay and parameter-change checks</text>
<text x="1341.5" y="1029" font-size="12.5" fill="#526477" font-weight="400" text-anchor="start"></text>
<text x="1341.5" y="1046" font-size="12.5" fill="#526477" font-weight="400" text-anchor="start">PDF input only; CAD exports are separate in #33</text>
<text x="1341.5" y="1063" font-size="12.5" fill="#526477" font-weight="400" text-anchor="start"></text>
<text x="1341.5" y="1080" font-size="12.5" fill="#526477" font-weight="400" text-anchor="start">STEPcode checks and actual stored-PMI inspection views</text>
<text x="1341.5" y="1097" font-size="12.5" fill="#526477" font-weight="400" text-anchor="start"></text>
