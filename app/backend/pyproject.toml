[project]
name = "drawing-demo"
version = "0.1.0"
description = "Drawing2CAD web API and agent runs on the shared drawing2cad-mcp domain service"
readme = "README.md"
authors = [
    { name = "dernerl", email = "50828248+dernerl@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "cascadio>=0.1.1",
    "cryptography>=50.0.2",
    "drawing2cad-mcp[cad]",
    "fastapi>=0.143.3",
    "httpx2>=2.13.1",
    "numpy>=2",
    "openai>=3.35.1",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
drawing-demo = "drawing_demo:main"

[dependency-groups]
dev = [
    "playwright>=1.64.0",
    "pytest>=9.1.1",
]

[tool.poetry]
packages = [{ include = "drawing_demo", from = "src" }]

[tool.poetry.dependencies]
# Locking range only. build123d 0.13.0 requires Python <3.15; requires-python stays unchanged.
python = ">=3.12,<3.15"
# Install the local MCP package as a copy, not as an editable link.
drawing2cad-mcp = { path = "../../drawing2cad-mcp", develop = false }

[build-system]
requires = ["poetry-core>=2.2,<3"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
# PyMuPDF reports SWIG import warnings that are unrelated to this code.
filterwarnings = ["ignore:builtin type .* has no __module__ attribute:DeprecationWarning"]
