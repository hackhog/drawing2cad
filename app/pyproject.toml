[project]
name = "drawing-demo"
version = "0.1.0"
description = "Drawing2CAD demo UI with PDF analysis through drawing2cad-mcp"
readme = "README.md"
authors = [
    { name = "dernerl", email = "50828248+dernerl@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "cascadio>=0.1.1",
    "drawing2cad-mcp",
    "fastapi>=0.143.3",
    "numpy>=2",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
drawing-demo = "drawing_demo:main"

[build-system]
requires = ["uv_build>=0.11.1,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
]

[tool.uv.sources]
drawing2cad-mcp = { path = "../drawing2cad-mcp", editable = false }

[tool.pytest.ini_options]
testpaths = ["tests"]
# PyMuPDF reports SWIG import warnings that are unrelated to this code.
filterwarnings = ["ignore:builtin type .* has no __module__ attribute:DeprecationWarning"]
