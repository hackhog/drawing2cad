# The frontend serves the built UI and forwards API requests to the backend (ADR 0012).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Maximum upload size: 50 MiB for STEP and 20 MiB for PDF in the API.
    client_max_body_size 50m;

    # Resolve the backend name through Docker DNS at runtime.
    # This permits startup before the backend and address changes after a restart.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8000;

    location /api/ {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
