# Frontend-Container (ADR 0012): liefert die gebaute Oberfläche aus und leitet /api an den Backend-Container weiter.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Größter Upload der API: STEP bis 50 MB (PDF bis 20 MB)
    client_max_body_size 50m;

    # Name zur Laufzeit über Dockers DNS auflösen: nginx startet auch, wenn das Backend noch fehlt,
    # und findet es nach einem Neustart unter neuer IP
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8000;

    location /api/ {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
