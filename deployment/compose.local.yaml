# drawing2cad built from the current source. Use it for unreleased changes. Run the commands from the repository root.
#   Web app:         docker compose --env-file .env -f deployment/compose.local.yaml up --build -d
#   MCP over stdio:  docker compose --env-file .env -f deployment/compose.local.yaml build mcp
#                    docker compose --env-file .env -f deployment/compose.local.yaml run --rm -T mcp
#   MCP over HTTP:   docker compose --env-file .env -f deployment/compose.local.yaml --profile mcp-http up --build -d mcp-http
# The services extend deployment/compose.yaml, so the runtime settings stay the same. Only the image source differs.
# The local tags keep a local build apart from the published images.
# Use --env-file .env to load the root file for interpolation. Shell values have priority.
# If no .env exists, omit --env-file .env. The service env_file remains optional.
name: drawing2cad

services:
  backend:
    extends:
      file: compose.yaml
      service: backend
    build:
      context: ..               # The MCP package is a path dependency at the repository root.
      dockerfile: deployment/Dockerfile
      target: backend           # The backend image starts from the shared runtime stage (ADR 0035).
    image: drawing2cad-backend:local

  frontend:
    extends:
      file: compose.yaml
      service: frontend
    build: ../app/frontend
    image: drawing2cad-frontend:local
    depends_on:
      backend:
        condition: service_healthy

  mcp:
    extends:
      file: compose.yaml
      service: mcp
    build:
      context: ..
      dockerfile: deployment/Dockerfile
      target: mcp
    image: drawing2cad-mcp:local

  mcp-http:
    extends:
      file: compose.yaml
      service: mcp-http
    build:
      context: ..
      dockerfile: deployment/Dockerfile
      target: mcp
    image: drawing2cad-mcp:local

volumes:
  backend-data:
  cad-data:
