# Web app from the published images of one version (ADR 0027): docker compose up, then open http://localhost:8000.
# DRAWING2CAD_VERSION selects the version tag, for example v1.3. Without it, Compose uses latest.
# To build unreleased changes locally, add compose.build.yaml: docker compose -f compose.yaml -f compose.build.yaml up --build
services:
  backend:
    image: ghcr.io/hackhog/drawing2cad-backend:${DRAWING2CAD_VERSION:-latest}
    # Only the frontend can reach this API through the Compose network.
    # Optional model endpoint for agent runs (ADR 0018). Without .env, the stack builds and runs; runs show as unavailable.
    env_file:
      - path: .env
        required: false
    environment:
      # The key can come from the shell instead of .env, for example from a password manager; the shell value wins.
      DRAWING2CAD_AGENT_API_KEY: ${DRAWING2CAD_AGENT_API_KEY:-}
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp                    # Temporary render artifacts of each analysis.
    volumes:
      - backend-data:/data      # Domain store (sources, parts, artifacts, notes, jobs) and web run records.

  frontend:
    image: ghcr.io/hackhog/drawing2cad-frontend:${DRAWING2CAD_VERSION:-latest}
    ports:
      - "127.0.0.1:8000:8080"   # Bind to the local computer only.
    depends_on:
      backend:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp                    # nginx PID file and temporary upload data.

volumes:
  backend-data:
