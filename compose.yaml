# Local demo: docker compose up --build, then open http://localhost:8000.
services:
  backend:
    build:
      context: .                # The MCP package is a path dependency at the repository root.
      dockerfile: app/backend/Dockerfile
    image: drawing2cad-backend:local
    # Only the frontend can reach this API through the Compose network.
    # Optional model endpoint for agent runs (ADR 0016). Without .env, the stack builds and runs; runs show as unavailable.
    env_file:
      - path: .env
        required: false
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp                    # Temporary render artifacts of each analysis.
    volumes:
      - backend-data:/data      # Sources, run records, and the MCP store (part revisions, builds, STEP).

  frontend:
    build: app/frontend
    image: drawing2cad-frontend:local
    ports:
      - "127.0.0.1:8000:8080"   # Bind to the local computer only.
    depends_on:
      backend:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp                    # nginx PID file and temporary upload data.

volumes:
  backend-data:
