# Local demo: docker compose up --build, then open http://localhost:8000.
services:
  app:
    build:
      context: .
      dockerfile: app/Dockerfile
    image: drawing2cad-app:local
    ports:
      - "127.0.0.1:8000:8000"   # Bind to the local computer only.
    read_only: true
    tmpfs:
      - /tmp                    # Keep uploads and render artifacts only during each request.
