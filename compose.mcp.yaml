# Remote clients upload PDF bytes through MCP. Persistent data stays in a volume.
# The service uses the published image of one version (ADR 0027). DRAWING2CAD_VERSION selects the version tag.
# To build unreleased changes locally, add compose.mcp.build.yaml after this file.
services:
  mcp:
    image: ghcr.io/hackhog/drawing2cad-mcp:${DRAWING2CAD_VERSION:-latest}
    stdin_open: true
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 4g
    cpus: 2
    pids_limit: 128
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=512m
    volumes:
      - cad-data:/data
volumes:
  cad-data:
