# Remote clients upload PDF bytes through MCP. Persistent data stays in a volume.
services:
  mcp:
    build:
      context: .
      dockerfile: drawing2cad-mcp/Dockerfile
      target: production
    image: drawing2cad-mcp:m2
    stdin_open: true
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 4g
    cpus: 2
    pids_limit: 128
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=512m
    volumes:
      - cad-data:/data
volumes:
  cad-data:
