[project]
name = "drawing-extractor"
version = "0.1.0"
description = "Deterministischer Vektor-Extraktor für technische Zeichnungs-PDFs (Drawing2CAD)"
readme = "README.md"
authors = [
    { name = "dernerl", email = "50828248+dernerl@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pillow>=12.3.0",
    "pymupdf>=1.28.2",
]

[build-system]
requires = ["uv_build>=0.11.1,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[project.scripts]
drawing-extract = "drawing_extractor.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
# PyMuPDF (SWIG) meldet beim Import Warnungen, die nichts mit unserem Code zu tun haben
filterwarnings = ["ignore:builtin type .* has no __module__ attribute:DeprecationWarning"]
