[project]
name = "drawing2cad-mcp"
version = "0.12.0"
description = "Drawing preparation, STEP inspection, and workflow evidence through MCP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp==2.3.0",
  "pypdf==6.10.0",
  "Pillow==12.3.0",
  "PyMuPDF==1.28.2",
  "jsonschema>=4.20,<5",
  "pydantic>=2.12,<3",
  "starlette>=1.8,<2",
  "uvicorn>=0.54,<1",
]

[project.optional-dependencies]
cad = ["build123d==0.13.0", "ezdxf==1.4.5"]
test = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "httpx2>=2.13,<3"]

[project.scripts]
drawing2cad-mcp = "drawing2cad_mcp.server:main"

[tool.poetry]
# Poetry includes all non-ignored files in the package directory, including the package data
# origins.json, glyph_templates.json, and py.typed. Check built wheels after a layout change.
packages = [{ include = "drawing2cad_mcp", from = "src" }]

[tool.poetry.dependencies]
# Locking range only. build123d 0.13.0 requires Python <3.15; requires-python stays unchanged.
python = ">=3.11,<3.15"

[build-system]
requires = ["poetry-core>=2.2,<3"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# PyMuPDF (SWIG) reports import warnings unrelated to this code.
filterwarnings = ["ignore:builtin type .* has no __module__ attribute:DeprecationWarning"]
